# =====================================================================
#  队伍爬虫 配置文件
#  本文件与“队伍爬虫.exe”放在同一个文件夹里。
#  用【记事本】打开即可修改：改完保存，再双击 exe 运行。
#
#  ★ 规则：只改等号【右边】的值，不要动等号左边或删任何 # 注释行。
# =====================================================================

[常用设置]
# ---- ★ 最重要的参数：抓哪个赛事的队伍 ----
#   浏览器打开 HLTV 队伍统计页 https://www.hltv.org/stats/teams
#   → 左侧勾选想要的赛事（可多选）→ 地址栏变成形如
#     https://www.hltv.org/stats/teams?event=8914&event=8240
#   → 把“?”开始到末尾的一整段（如 ?event=8914&event=8240）复制，粘贴到下面
eventfilter = ?event=8914

# ---- 最少打多少张图才纳入统计（0 = 不限制） ----
minMapCount = 0

# ---- 你电脑上 Chrome 的主版本号（例：Chrome 132 就填 132） ----
#   留空 = 程序自动探测（绝大多数情况请留空）
#   自动探测失败报错时，再回来填你 Chrome 的版本号
chrome_version =

# ---- 表格存到哪个文件夹 ----
#   留空 = 自动在 exe 旁边建一个“结果”文件夹
#   也可填绝对路径，例如 D:\数据\队伍
output_dir =

# ---- 输出的 Excel 文件名（含 .xlsx） ----
output_name = teamstat.xlsx
