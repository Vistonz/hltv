# =====================================================================
#  年度榜单爬虫 配置文件
#  本文件与“年度榜单爬虫.exe”放在同一个文件夹里。
#  用【记事本】打开即可修改：改完保存，再双击 exe 运行。
#
#  ★ 规则：只改等号【右边】的值，不要动等号左边或删任何 # 注释行。
# =====================================================================

[常用设置]
# ---- 最少打多少张图才纳入统计（数字越小人越多） ----
#   0   = 不限制，所有选手都抓
#   65  = 只抓打过 65 张图以上的选手（本表默认口径）
minMapCount = 65

# ---- 只统计综合 rating 大于此数的选手 ----
minrating = 1.04

# ---- 你电脑上 Chrome 的主版本号（例：Chrome 132 就填 132） ----
#   留空 = 程序自动探测（绝大多数情况请留空）
#   自动探测失败报错时，再回来填你 Chrome 的版本号
chrome_version =

# ---- 表格存到哪个文件夹 ----
#   留空 = 自动在 exe 旁边建一个“结果”文件夹
#   也可填绝对路径，例如 D:\数据\排名表
output_dir =

# ---- 输出的 Excel 文件名（含 .xlsx） ----
output_name = rating2026.xlsx

# =====================================================================
#  赛事口径设置（进阶用户才动）
#  下面这些是很长的“赛事筛选串”，决定普通/大型/精英/顶级/竞技场
#  各口径各统计哪些赛事。正常使用【不要改】；要换新一届赛事时才整套更新。
#
#  来源：浏览器打开 https://www.hltv.org/stats/players
#  → 左侧勾选赛事 → 地址栏出现 ?event=8240&event=8876 之类
#  → 把“?”开始到末尾的一整段复制，粘贴替换到相应行。
# =====================================================================

[赛事口径设置]
# 普通口径：抓所有列出的赛事（最全的一批）
eventfilter = ?event=8876&event=8246&event=8575&event=8240&event=8047&event=8241&event=8412&event=8413&event=8248&event=8048&event=8242&event=8250&event=8049&event=8243&event=8263&event=9028&event=9029&event=8301&event=8914

# 大型赛事口径（Big event）
bigeventfilter = ?&event=8246&event=8575&event=8240&event=8047&event=8413&event=8248&event=8242&event=8250&event=8049&event=8243&event=8301

# 精英赛事口径（Elite event，限定线下赛 Lan）
eliteeventfilter = ?&event=8240&event=8876&event=8047&event=8248&event=8301&matchType=Lan

# 顶级赛事口径（Super elite，限定线下赛 Lan）
supereliteeventfilter = ?&event=8240&event=8876&event=8301&matchType=Lan

# 竞技场/大场馆口径（限定线下赛 + 季后赛）
arenafilter = ?&event=8240&event=8876&event=8047&event=8413&event=8248&event=8242&event=8250&event=8049&event=8243&event=8301&playoffMatchType=PLAYOFFS&matchType=Lan
