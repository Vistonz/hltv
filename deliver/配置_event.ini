# =====================================================================
#  单赛事爬虫 配置文件
#  本文件与“单赛事爬虫.exe”放在同一个文件夹里。
#  用【记事本】打开即可修改：改完保存，再双击 exe 运行。
#
#  ★ 规则：只改等号【右边】的值，不要动等号左边或删任何 # 注释行。
# =====================================================================

[常用设置]
# ---- ★ 最重要的参数：抓哪一届赛事 ----
#   浏览器打开 HLTV 选手统计页 https://www.hltv.org/stats/players
#   → 左侧勾选想要的赛事（可多选）→ 地址栏变成形如
#     https://www.hltv.org/stats/players?event=8914&event=8240
#   → 把“?”开始到末尾的一整段（如 ?event=8914&event=8240）复制，粘贴到下面
eventfilter = ?event=8914

# ---- 最少打多少张图才纳入统计（0 = 不限制） ----
minMapCount = 0

# ---- 只统计综合 rating 大于此数的选手 ----
minrating = 0

# ---- 你电脑上 Chrome 的主版本号（例：Chrome 132 就填 132） ----
#   留空 = 程序自动探测（绝大多数情况请留空）
#   自动探测失败报错时，再回来填你 Chrome 的版本号
chrome_version =

# ---- 表格存到哪个文件夹 ----
#   留空 = 自动在 exe 旁边建一个“结果”文件夹
#   也可填绝对路径，例如 D:\数据\单赛事
output_dir =

# ---- 输出的 Excel 文件名（含 .xlsx） ----
output_name = rating_group.xlsx

# =====================================================================
#  高级设置（给懂 HLTV 赛制的人；改错会抓错，不懂请保持默认）
# =====================================================================

[高级设置]
# ---- 赛事“阶段”日期状态机 ----
# 作用：把选手的历史比赛按日期切到“哪一届、哪些局算淘汰赛回家局”。
# 每组 6 个数字、英文逗号分隔，含义依次为：
#     起始日, 起始月, 结束日, 结束月, 输几局算被淘汰, 赢几局换一条命
# 多组之间用英文分号 ; 分隔。
# ⚠ 请保留最后一行“99,99,99,99,99,9999”作为结尾标记，不要删。
# 默认是两行示例，实际按你要抓的赛事填。示例格式：
#   stagedate = 16,5,19,5,2,9999 ; 99,99,99,99,99,9999
stagedate = 16,5,19,5,2,9999 ; 99,99,99,99,99,9999
